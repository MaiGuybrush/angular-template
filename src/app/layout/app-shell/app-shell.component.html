<header class="app-header">
  <div class="header-left">
    <button class="toggle-sidebar-btn" (click)="toggleSidebar()" aria-label="Toggle Sidebar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <span class="app-title">{{ appTitle() }}</span>
  </div>

  <div class="header-right">
    @if (currentUser(); as user) {
      <div class="user-profile">
        <span class="user-name">{{ user.name }}</span>
        <span class="user-id">({{ user.id }})</span>
        <span class="user-shop">{{ user.orgShop || (user.shops && user.shops[0]) || 'FAB' }}</span>
      </div>
      <button class="logout-btn" (click)="logout()">登出</button>
    }
  </div>
</header>

<div class="app-body">
  <aside class="sidebar" [class.collapsed]="isSidebarCollapsed()">
    <nav class="sidebar-nav">
      @for (item of navItems(); track item.route) {
        <a [routerLink]="item.route" routerLinkActive="active" class="sidebar-nav-item">
          <span class="nav-icon">
            @if (item.icon === 'dashboard') {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
              </svg>
            } @else {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
            }
          </span>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <main class="main-viewport">
    <router-outlet></router-outlet>
  </main>
</div>
