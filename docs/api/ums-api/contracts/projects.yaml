openapi: 3.0.3
info:
  title: UMS Projects API
  description: |
    Universal Model Studio 專案管理 API
    提供專案的 CRUD 操作、成員管理和資源配額設定功能
  version: 1.0.0
  contact:
    name: UMS API Support
    email: support@ums.example.com

servers:
  - url: https://api.ums.example.com/api/v1
    description: 生產環境
  - url: https://api-staging.ums.example.com/api/v1
    description: 測試環境
  - url: http://localhost:5000/api/v1
    description: 本地開發環境

tags:
  - name: Projects
    description: 專案管理操作
  - name: Project Members
    description: 專案成員管理

paths:
  /projects:
    get:
      tags:
        - Projects
      summary: 查詢專案清單
      description: 取得使用者可存取的專案清單，支援分頁、過濾和排序
      operationId: getProjects
      parameters:
        - name: page
          in: query
          description: 頁碼（從 1 開始）
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          description: 每頁筆數
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: teamId
          in: query
          description: 過濾特定團隊的專案
          required: false
          schema:
            type: integer
        - name: status
          in: query
          description: 過濾專案狀態
          required: false
          schema:
            type: string
            enum: [Active, Archived, Deleted]
        - name: search
          in: query
          description: 搜尋專案名稱或描述
          required: false
          schema:
            type: string
        - name: sortBy
          in: query
          description: 排序欄位
          required: false
          schema:
            type: string
            default: CreatedAt
            enum: [ProjectName, CreatedAt, UpdatedAt]
        - name: sortOrder
          in: query
          description: 排序方向
          required: false
          schema:
            type: string
            default: desc
            enum: [asc, desc]
        - name: includeTotalCount
          in: query
          description: 是否回傳總筆數（僅第一頁有效）
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 成功取得專案清單
          headers:
            hasMore:
              description: 是否還有更多頁
              schema:
                type: boolean
            totalCount:
              description: 總筆數（僅當 includeTotalCount=true 且 page=1 時回傳）
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - BearerAuth: []
        - ApiKeyAuth: []

    post:
      tags:
        - Projects
      summary: 建立專案
      description: 在指定團隊中建立新專案
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: 專案建立成功
          headers:
            Location:
              description: 新建專案的 URL
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - BearerAuth: []
        - ApiKeyAuth: []

  /projects/{projectId}:
    get:
      tags:
        - Projects
      summary: 查詢單一專案詳細資訊
      description: 根據專案 ID 取得專案完整資訊
      operationId: getProjectById
      parameters:
        - name: projectId
          in: path
          required: true
          description: 專案 ID
          schema:
            type: integer
      responses:
        '200':
          description: 成功取得專案資訊
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - BearerAuth: []
        - ApiKeyAuth: []

    put:
      tags:
        - Projects
      summary: 完整更新專案
      description: 完整更新專案資訊（所有欄位）
      operationId: updateProject
      parameters:
        - name: projectId
          in: path
          required: true
          description: 專案 ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: 專案更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - BearerAuth: []
        - ApiKeyAuth: []

    delete:
      tags:
        - Projects
      summary: 刪除專案（軟刪除）
      description: 將專案標記為已刪除狀態，不實際刪除資料
      operationId: deleteProject
      parameters:
        - name: projectId
          in: path
          required: true
          description: 專案 ID
          schema:
            type: integer
      responses:
        '204':
          description: 專案刪除成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 專案有相依資源，無法刪除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - BearerAuth: []
        - ApiKeyAuth: []

  /projects/{projectId}/members:
    get:
      tags:
        - Project Members
      summary: 查詢專案成員清單
      description: 取得專案的所有成員及其角色
      operationId: getProjectMembers
      parameters:
        - name: projectId
          in: path
          required: true
          description: 專案 ID
          schema:
            type: integer
      responses:
        '200':
          description: 成功取得成員清單
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectMemberDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - BearerAuth: []
        - ApiKeyAuth: []

    post:
      tags:
        - Project Members
      summary: 新增專案成員
      description: 將使用者加入專案並指定角色
      operationId: addProjectMember
      parameters:
        - name: projectId
          in: path
          required: true
          description: 專案 ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProjectMemberRequest'
      responses:
        '201':
          description: 成員新增成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ProjectMemberDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 成員已存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - BearerAuth: []
        - ApiKeyAuth: []

  /projects/{projectId}/members/{memberId}:
    put:
      tags:
        - Project Members
      summary: 更新專案成員角色
      description: 修改專案成員的角色權限
      operationId: updateProjectMemberRole
      parameters:
        - name: projectId
          in: path
          required: true
          description: 專案 ID
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          description: 成員 ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  type: string
                  enum: [Owner, Editor, Viewer]
                  description: 新的角色
      responses:
        '200':
          description: 角色更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ProjectMemberDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - BearerAuth: []
        - ApiKeyAuth: []

    delete:
      tags:
        - Project Members
      summary: 移除專案成員
      description: 將成員從專案中移除
      operationId: removeProjectMember
      parameters:
        - name: projectId
          in: path
          required: true
          description: 專案 ID
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          description: 成員 ID
          schema:
            type: integer
      responses:
        '204':
          description: 成員移除成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 無法移除最後一個 Owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - BearerAuth: []
        - ApiKeyAuth: []

components:
  schemas:
    ProjectListResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProjectListItemDto'

    ProjectDetailResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/ProjectDetailDto'

    ProjectListItemDto:
      type: object
      required:
        - projectId
        - projectName
        - teamId
        - teamName
        - status
        - createdAt
        - updatedAt
      properties:
        projectId:
          type: integer
          example: 1
        projectName:
          type: string
          example: "影像分類專案"
        description:
          type: string
          nullable: true
          example: "使用 YOLOv8 進行物件偵測"
        teamId:
          type: integer
          example: 1
        teamName:
          type: string
          example: "AI 研發團隊"
        status:
          type: string
          enum: [Active, Archived, Deleted]
          example: "Active"
        datasetCount:
          type: integer
          example: 3
        modelCount:
          type: integer
          example: 2
        createdAt:
          type: string
          format: date-time
          example: "2026-01-01T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-01-08T15:30:00Z"

    ProjectDetailDto:
      type: object
      required:
        - projectId
        - projectName
        - teamId
        - teamName
        - createdBy
        - creatorName
        - status
        - createdAt
        - updatedAt
      properties:
        projectId:
          type: integer
          example: 1
        projectName:
          type: string
          example: "影像分類專案"
        description:
          type: string
          nullable: true
          example: "使用 YOLOv8 進行物件偵測"
        teamId:
          type: integer
          example: 1
        teamName:
          type: string
          example: "AI 研發團隊"
        createdBy:
          type: integer
          example: 5
        creatorName:
          type: string
          example: "張小明"
        status:
          type: string
          enum: [Active, Archived, Deleted]
          example: "Active"
        createdAt:
          type: string
          format: date-time
          example: "2026-01-01T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-01-08T15:30:00Z"
        datasetCount:
          type: integer
          example: 3
        modelCount:
          type: integer
          example: 2
        deploymentCount:
          type: integer
          example: 1
        members:
          type: array
          items:
            $ref: '#/components/schemas/ProjectMemberDto'

    CreateProjectRequest:
      type: object
      required:
        - projectName
        - teamId
      properties:
        projectName:
          type: string
          minLength: 1
          maxLength: 100
          example: "新專案"
        description:
          type: string
          maxLength: 500
          nullable: true
          example: "專案描述"
        teamId:
          type: integer
          minimum: 1
          example: 1

    UpdateProjectRequest:
      type: object
      required:
        - projectName
      properties:
        projectName:
          type: string
          minLength: 1
          maxLength: 100
          example: "更新後的專案名稱"
        description:
          type: string
          maxLength: 500
          nullable: true
          example: "更新後的描述"

    ProjectMemberDto:
      type: object
      required:
        - memberId
        - userId
        - userName
        - role
        - joinedAt
      properties:
        memberId:
          type: integer
          example: 1
        userId:
          type: integer
          example: 5
        userName:
          type: string
          example: "張小明"
        role:
          type: string
          enum: [Owner, Editor, Viewer]
          example: "Editor"
        grantedBy:
          type: integer
          example: 1
        grantorName:
          type: string
          example: "李管理員"
        joinedAt:
          type: string
          format: date-time
          example: "2026-01-01T10:00:00Z"

    AddProjectMemberRequest:
      type: object
      required:
        - userId
        - role
      properties:
        userId:
          type: integer
          minimum: 1
          example: 5
        role:
          type: string
          enum: [Owner, Editor, Viewer]
          example: "Editor"

    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: "PROJECT_NAME_DUPLICATE"
            message:
              type: string
              example: "專案名稱已存在於此團隊中"
            validationErrors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
              example:
                ProjectName:
                  - "專案名稱不可為空"
                  - "專案名稱不可超過 100 字元"

  responses:
    BadRequest:
      description: 請求參數錯誤
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: "VALIDATION_ERROR"
              message: "請求驗證失敗"
              validationErrors:
                ProjectName:
                  - "專案名稱為必填"

    Unauthorized:
      description: 未授權或 Token 無效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: "UNAUTHORIZED"
              message: "未提供有效的認證資訊"

    Forbidden:
      description: 無權限執行此操作
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: "FORBIDDEN"
              message: "您沒有權限執行此操作"

    NotFound:
      description: 資源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: "NOT_FOUND"
              message: "找不到指定的專案"

    Conflict:
      description: 資源衝突（如重複名稱、並發衝突）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: "CONFLICT"
              message: "專案名稱已存在或資源版本衝突"

    InternalServerError:
      description: 伺服器內部錯誤
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: "INTERNAL_SERVER_ERROR"
              message: "伺服器發生錯誤，請稍後再試"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer Token（SSO 登入後取得）

    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API Key 認證（適用於第三方整合）
