openapi: 3.0.3
info:
  title: UMS Platform - Audit Logs API
  description: |
    審計日誌 API，提供系統操作記錄的查詢、過濾與匯出功能。
    
    **功能涵蓋**：
    - 審計日誌查詢（支援多維度過濾）
    - 使用者操作歷史追蹤
    - 資源變更記錄追蹤
    - 審計日誌匯出（CSV/JSON 格式）
    
    **記錄內容**：
    - 使用者操作（CREATE/UPDATE/DELETE 等）
    - 操作時間與 IP 位址
    - 目標資源類型與 ID
    - 操作前後資料變更（敏感欄位已遮罩）
  version: 1.0.0

servers:
  - url: https://api.ums.example.com/api/v1

tags:
  - name: Audit Logs

paths:
  /audit-logs:
    get:
      tags: [Audit Logs]
      summary: 查詢審計日誌
      description: |
        查詢審計日誌，支援多維度過濾條件：
        - 使用者
        - 操作類型
        - 目標資源類型與 ID
        - 時間範圍
        - API Key
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: userId
          in: query
          schema:
            type: integer
          description: 過濾特定使用者的操作
        - name: actionType
          in: query
          schema:
            type: string
            enum: 
              - CREATE
              - UPDATE
              - DELETE
              - LOGIN
              - LOGOUT
              - ACCESS
              - EXPORT
              - REVOKE
          description: 過濾操作類型
        - name: targetEntityType
          in: query
          schema:
            type: string
            enum:
              - Project
              - Dataset
              - Model
              - Deployment
              - TrainingJob
              - ApiKey
              - User
              - Team
          description: 過濾目標資源類型
        - name: targetEntityId
          in: query
          schema:
            type: integer
          description: 過濾特定資源 ID（需搭配 targetEntityType）
        - name: apiKeyId
          in: query
          schema:
            type: integer
          description: 過濾使用特定 API Key 的操作
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
          description: 查詢起始時間
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
          description: 查詢結束時間
        - name: search
          in: query
          schema:
            type: string
          description: 搜尋操作描述或備註
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: sortOrder
          in: query
          schema:
            type: string
            default: desc
            enum: [asc, desc]
          description: 排序方向（按時間）
      responses:
        '200':
          description: 成功取得審計日誌
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/AuditLogDto'
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      totalCount:
                        type: integer
                      totalPages:
                        type: integer
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: 權限不足（僅管理員或資源擁有者可查詢審計日誌）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /audit-logs/{logId}:
    get:
      tags: [Audit Logs]
      summary: 查詢單一審計日誌詳細資訊
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: logId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 成功取得審計日誌詳細資訊
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AuditLogDetailDto'
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /audit-logs/export:
    get:
      tags: [Audit Logs]
      summary: 匯出審計日誌
      description: |
        匯出審計日誌為 CSV 或 JSON 格式。
        
        **注意**：
        - 單次匯出最多 10,000 筆記錄
        - 匯出操作本身也會被記錄到審計日誌
      security:
        - BearerAuth: []
      parameters:
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [csv, json]
          description: 匯出格式
        - name: userId
          in: query
          schema:
            type: integer
        - name: actionType
          in: query
          schema:
            type: string
        - name: targetEntityType
          in: query
          schema:
            type: string
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 匯出成功，返回檔案
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLogDto'
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="audit_logs_20260109.csv"
        '400':
          description: 請求參數錯誤或超過匯出筆數限制
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: EXPORT_LIMIT_EXCEEDED
                  message: 匯出筆數超過限制（最多 10,000 筆），請縮小時間範圍
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /audit-logs/stats:
    get:
      tags: [Audit Logs]
      summary: 查詢審計日誌統計
      description: 查詢指定時間範圍內的審計日誌統計資訊
      security:
        - BearerAuth: []
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [user, actionType, entityType, hour, day]
            default: day
          description: 統計分組方式
      responses:
        '200':
          description: 成功取得統計資訊
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AuditLogStatsDto'
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key

  schemas:
    AuditLogDto:
      type: object
      properties:
        logId:
          type: integer
          example: 10001
        userId:
          type: integer
          example: 5
        userName:
          type: string
          example: 張三
        actionType:
          type: string
          enum: [CREATE, UPDATE, DELETE, LOGIN, LOGOUT, ACCESS, EXPORT, REVOKE]
          example: CREATE
        targetEntityType:
          type: string
          enum: [Project, Dataset, Model, Deployment, TrainingJob, ApiKey, User, Team]
          example: Project
        targetEntityId:
          type: integer
          example: 100
        description:
          type: string
          example: 建立新專案 "Computer Vision Project"
        ipAddress:
          type: string
          example: 192.168.1.50
        userAgent:
          type: string
          example: Mozilla/5.0 (Windows NT 10.0; Win64; x64)
        apiKeyId:
          type: integer
          example: 25
          description: 若使用 API Key 認證，記錄 Key ID
        timestamp:
          type: string
          format: date-time
          example: '2026-01-09T10:30:00Z'
        success:
          type: boolean
          example: true
          description: 操作是否成功

    AuditLogDetailDto:
      allOf:
        - $ref: '#/components/schemas/AuditLogDto'
        - type: object
          properties:
            requestMethod:
              type: string
              example: POST
            requestPath:
              type: string
              example: /api/v1/projects
            responseStatus:
              type: integer
              example: 201
            changesBefore:
              type: object
              description: 操作前的資料狀態（僅 UPDATE 操作）
              example:
                projectName: Old Project Name
                description: Old description
            changesAfter:
              type: object
              description: 操作後的資料狀態
              example:
                projectName: New Project Name
                description: Updated description
            errorMessage:
              type: string
              description: 錯誤訊息（若 success=false）
            sessionId:
              type: string
              example: session_abc123
              description: 使用者會話 ID

    AuditLogStatsDto:
      type: object
      properties:
        period:
          type: object
          properties:
            startDate:
              type: string
              format: date-time
            endDate:
              type: string
              format: date-time
        totalLogs:
          type: integer
          example: 5000
        groupedStats:
          type: array
          items:
            type: object
            properties:
              group:
                type: string
                example: '2026-01-09'
                description: 分組值（依 groupBy 參數而定）
              count:
                type: integer
                example: 250
        actionTypeBreakdown:
          type: object
          additionalProperties:
            type: integer
          example:
            CREATE: 1500
            UPDATE: 2000
            DELETE: 300
            ACCESS: 1200
        entityTypeBreakdown:
          type: object
          additionalProperties:
            type: integer
          example:
            Project: 500
            Dataset: 800
            Model: 1200
            Deployment: 600
        topUsers:
          type: array
          items:
            type: object
            properties:
              userId:
                type: integer
              userName:
                type: string
              actionCount:
                type: integer
          description: 操作次數最多的前 10 名使用者

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

  responses:
    BadRequestError:
      description: 請求參數錯誤
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    
    UnauthorizedError:
      description: 未授權
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    
    ForbiddenError:
      description: 權限不足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    
    NotFoundError:
      description: 資源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    
    InternalServerError:
      description: 伺服器內部錯誤
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
