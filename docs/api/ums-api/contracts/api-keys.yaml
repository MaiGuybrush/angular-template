openapi: 3.0.3
info:
  title: UMS Platform - API Keys Management
  description: |
    API Key 管理 API，提供 API Key 的生成、查詢、撤銷與權限管理功能。
    
    **功能涵蓋**：
    - API Key 生成（支援自訂權限範圍與速率限制）
    - API Key 清單查詢
    - API Key 撤銷
    - API Key 使用記錄查詢
    
    **安全注意事項**：
    - API Key 明文僅在生成時顯示一次
    - 撤銷後的 API Key 無法恢復
    - 建議定期輪換 API Key
  version: 1.0.0

servers:
  - url: https://api.ums.example.com/api/v1

tags:
  - name: API Keys

paths:
  /api-keys:
    get:
      tags: [API Keys]
      summary: 查詢 API Key 清單
      description: 查詢當前使用者的所有 API Key（不包含明文金鑰）
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [Active, Revoked, Expired]
          description: 過濾 API Key 狀態
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 成功取得 API Key 清單
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/ApiKeyListItemDto'
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      totalCount:
                        type: integer
                      totalPages:
                        type: integer
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    post:
      tags: [API Keys]
      summary: 產生新 API Key
      description: |
        產生新的 API Key，可自訂權限範圍、速率限制與過期時間。
        
        **重要**：API Key 明文僅在此回應中顯示一次，請妥善保管。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: API Key 產生成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ApiKeyCreatedDto'
                  message:
                    type: string
                    example: API Key 產生成功，請妥善保管明文金鑰
              example:
                success: true
                data:
                  keyId: 100
                  keyName: Production API Key
                  apiKey: ums_live_1a2b3c4d5e6f7g8h9i0j
                  scope:
                    resources: [projects, models, deployments]
                    permissions: [read, write]
                    maxRequestsPerMinute: 1000
                  expiresAt: '2027-01-01T00:00:00Z'
                  createdAt: '2026-01-09T10:00:00Z'
                message: API Key 產生成功，請妥善保管明文金鑰
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api-keys/{keyId}:
    get:
      tags: [API Keys]
      summary: 查詢 API Key 詳細資訊
      description: 查詢 API Key 詳細資訊（不包含明文金鑰）
      security:
        - BearerAuth: []
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: 成功取得 API Key 詳細資訊
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ApiKeyDetailDto'
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    delete:
      tags: [API Keys]
      summary: 撤銷 API Key
      description: |
        撤銷 API Key，撤銷後立即失效且無法恢復。
        
        **注意**：所有使用此 API Key 的請求將立即被拒絕。
      security:
        - BearerAuth: []
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: API Key 撤銷成功
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api-keys/{keyId}/usage:
    get:
      tags: [API Keys]
      summary: 查詢 API Key 使用記錄
      description: 查詢 API Key 的使用統計與最近的請求記錄
      security:
        - BearerAuth: []
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: integer
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
          description: 查詢起始時間
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
          description: 查詢結束時間
      responses:
        '200':
          description: 成功取得使用記錄
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ApiKeyUsageDto'
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key

  schemas:
    ApiKeyListItemDto:
      type: object
      properties:
        keyId:
          type: integer
          example: 100
        keyName:
          type: string
          example: Production API Key
        keyPrefix:
          type: string
          example: ums_live_1a2b
          description: API Key 前綴（用於識別，非完整金鑰）
        status:
          type: string
          enum: [Active, Revoked, Expired]
          example: Active
        scope:
          type: object
          properties:
            resources:
              type: array
              items:
                type: string
              example: [projects, models, deployments]
            permissions:
              type: array
              items:
                type: string
              example: [read, write]
            maxRequestsPerMinute:
              type: integer
              example: 1000
        lastUsedAt:
          type: string
          format: date-time
          example: '2026-01-09T09:30:00Z'
        expiresAt:
          type: string
          format: date-time
          example: '2027-01-01T00:00:00Z'
        createdAt:
          type: string
          format: date-time
          example: '2026-01-01T00:00:00Z'

    ApiKeyDetailDto:
      type: object
      properties:
        keyId:
          type: integer
        keyName:
          type: string
        keyPrefix:
          type: string
        status:
          type: string
          enum: [Active, Revoked, Expired]
        scope:
          type: object
          properties:
            resources:
              type: array
              items:
                type: string
            permissions:
              type: array
              items:
                type: string
            maxRequestsPerMinute:
              type: integer
        ownerId:
          type: integer
        ownerName:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        usageStats:
          type: object
          properties:
            totalRequests:
              type: integer
              example: 15000
            last24Hours:
              type: integer
              example: 1200
            last7Days:
              type: integer
              example: 8500

    CreateApiKeyRequest:
      type: object
      required:
        - keyName
        - scope
      properties:
        keyName:
          type: string
          maxLength: 100
          example: Production API Key
          description: API Key 識別名稱
        scope:
          type: object
          required:
            - resources
            - permissions
          properties:
            resources:
              type: array
              items:
                type: string
                enum: [projects, datasets, models, deployments, training-jobs, api-keys]
              minItems: 1
              example: [projects, models, deployments]
              description: 允許存取的資源類型
            permissions:
              type: array
              items:
                type: string
                enum: [read, write, delete]
              minItems: 1
              example: [read, write]
              description: 允許的操作權限
            maxRequestsPerMinute:
              type: integer
              minimum: 1
              maximum: 10000
              default: 1000
              example: 1000
              description: 每分鐘最大請求數（速率限制）
        expiresAt:
          type: string
          format: date-time
          example: '2027-01-01T00:00:00Z'
          description: API Key 過期時間（選填，預設永不過期）

    ApiKeyCreatedDto:
      type: object
      properties:
        keyId:
          type: integer
          example: 100
        keyName:
          type: string
          example: Production API Key
        apiKey:
          type: string
          example: ums_live_1a2b3c4d5e6f7g8h9i0j
          description: API Key 明文（僅顯示一次）
        scope:
          type: object
          properties:
            resources:
              type: array
              items:
                type: string
            permissions:
              type: array
              items:
                type: string
            maxRequestsPerMinute:
              type: integer
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    ApiKeyUsageDto:
      type: object
      properties:
        keyId:
          type: integer
        keyName:
          type: string
        statistics:
          type: object
          properties:
            totalRequests:
              type: integer
              example: 15000
            successfulRequests:
              type: integer
              example: 14500
            failedRequests:
              type: integer
              example: 500
            avgResponseTime:
              type: number
              format: float
              example: 120.5
              description: 平均回應時間（毫秒）
        recentRequests:
          type: array
          items:
            type: object
            properties:
              timestamp:
                type: string
                format: date-time
              method:
                type: string
                example: GET
              endpoint:
                type: string
                example: /api/v1/projects
              statusCode:
                type: integer
                example: 200
              responseTime:
                type: number
                example: 95.3
          description: 最近 100 筆請求記錄

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            validationErrors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string

  responses:
    BadRequestError:
      description: 請求參數錯誤或驗證失敗
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    
    UnauthorizedError:
      description: 未提供有效的認證資訊
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    
    ForbiddenError:
      description: 權限不足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    
    NotFoundError:
      description: 資源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    
    InternalServerError:
      description: 伺服器內部錯誤
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
