        - labelName
        - annotationType
        - coordinates
      properties:
        labelName:
          type: string
          maxLength: 50
          example: cat
        annotationType:
          type: string
          enum: [BoundingBox, Polygon, Point, Segmentation]
          example: BoundingBox
        coordinates:
          type: object
          description: 座標資料（JSON object）
          example:
            x: 100
            y: 150
            width: 300
            height: 400
        confidence:
          type: number
          format: float
