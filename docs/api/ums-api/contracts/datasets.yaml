          example:
            x: 100
            y: 150
            width: 300
            height: 400
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          example: 0.95
        annotatedBy:
          type: integer
        annotatorName:
          type: string
        annotatedAt:
          type: string
          format: date-time

    CreateAnnotationRequest:
      type: object
