        labelName:
          type: string
          maxLength: 50
        coordinates:
          type: object
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: 請求資料驗證失敗
            validationErrors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
              example:
                datasetName:
                  - 資料集名稱為必填欄位
                  - 資料集名稱長度不得超過 100 字元

  responses:
    BadRequestError:
      description: 請求參數錯誤或驗證失敗
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: 請求資料驗證失敗
              validationErrors:
                datasetName:
                  - 資料集名稱為必填欄位
    
    UnauthorizedError:
      description: 未提供有效的認證資訊
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: 請提供有效的 JWT Token 或 API Key
    
    ForbiddenError:
      description: 權限不足，無法執行此操作
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: FORBIDDEN
              message: 您沒有權限存取此資源
    
    NotFoundError:
      description: 請求的資源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: 請求的資源不存在
    
    ConflictError:
      description: 資源衝突（例如：名稱重複）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: CONFLICT
              message: 資源名稱已存在，請使用其他名稱
    
    InternalServerError:
      description: 伺服器內部錯誤
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: INTERNAL_SERVER_ERROR
              message: 伺服器發生錯誤，請稍後再試
