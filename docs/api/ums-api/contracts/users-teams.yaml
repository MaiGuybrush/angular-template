openapi: 3.0.3
info:
  title: UMS Platform - Users & Teams API
  description: |
    使用者與團隊管理 API，提供使用者個人資料、團隊管理與團隊成員管理功能。
    
    **功能涵蓋**：
    - 使用者個人資料查詢與更新
    - 團隊 CRUD 操作
    - 團隊成員管理
  version: 1.0.0

servers:
  - url: https://api.ums.example.com/api/v1

tags:
  - name: Users
  - name: Teams
  - name: Team Members

paths:
  /users/me:
    get:
      tags: [Users]
      summary: 查詢當前使用者個人資料
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/UserProfileDto'
    
    put:
      tags: [Users]
      summary: 更新當前使用者個人資料
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':
          description: 更新成功

  /users/{userId}:
    get:
      tags: [Users]
      summary: 查詢指定使用者資料
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/UserDto'

  /teams:
    get:
      tags: [Teams]
      summary: 查詢團隊清單
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/TeamListItemDto'
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      totalCount:
                        type: integer
    
    post:
      tags: [Teams]
      summary: 建立新團隊
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
      responses:
        '201':
          description: 團隊建立成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TeamDetailDto'

  /teams/{teamId}:
    get:
      tags: [Teams]
      summary: 查詢團隊詳細資訊
      security:
        - BearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TeamDetailDto'
    
    put:
      tags: [Teams]
      summary: 更新團隊
      security:
        - BearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamRequest'
      responses:
        '200':
          description: 更新成功
    
    delete:
      tags: [Teams]
      summary: 刪除團隊
      security:
        - BearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: 刪除成功

  /teams/{teamId}/members:
    get:
      tags: [Team Members]
      summary: 查詢團隊成員清單
      security:
        - BearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TeamMemberDto'
    
    post:
      tags: [Team Members]
      summary: 新增團隊成員
      security:
        - BearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTeamMemberRequest'
      responses:
        '201':
          description: 成員新增成功

  /teams/{teamId}/members/{memberId}:
    put:
      tags: [Team Members]
      summary: 更新團隊成員角色
      security:
        - BearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamMemberRoleRequest'
      responses:
        '200':
          description: 更新成功
    
    delete:
      tags: [Team Members]
      summary: 移除團隊成員
      security:
        - BearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: 移除成功

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  schemas:
    UserProfileDto:
      type: object
      properties:
        userId:
          type: integer
        username:
          type: string
        email:
          type: string
        fullName:
          type: string
        phoneNumber:
          type: string
        department:
          type: string
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time

    UserDto:
      type: object
      properties:
        userId:
          type: integer
        username:
          type: string
        fullName:
          type: string
        email:
          type: string

    UpdateUserProfileRequest:
      type: object
      properties:
        fullName:
          type: string
          maxLength: 100
        phoneNumber:
          type: string
          maxLength: 20
        department:
          type: string
          maxLength: 100

    TeamListItemDto:
      type: object
      properties:
        teamId:
          type: integer
        teamName:
          type: string
        description:
          type: string
        memberCount:
          type: integer
        projectCount:
          type: integer
        createdBy:
          type: integer
        creatorName:
          type: string
        createdAt:
          type: string
          format: date-time

    TeamDetailDto:
      type: object
      properties:
        teamId:
          type: integer
        teamName:
          type: string
        description:
          type: string
        createdBy:
          type: integer
        creatorName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        memberCount:
          type: integer
        projectCount:
          type: integer
        members:
          type: array
          items:
            $ref: '#/components/schemas/TeamMemberDto'

    CreateTeamRequest:
      type: object
      required:
        - teamName
      properties:
        teamName:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500

    UpdateTeamRequest:
      type: object
      properties:
        teamName:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500

    TeamMemberDto:
      type: object
      properties:
        memberId:
          type: integer
        userId:
          type: integer
        userName:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum: [Owner, Admin, Member]
        joinedAt:
          type: string
          format: date-time

    AddTeamMemberRequest:
      type: object
      required:
        - userId
        - role
      properties:
        userId:
          type: integer
        role:
          type: string
          enum: [Admin, Member]

    UpdateTeamMemberRoleRequest:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum: [Owner, Admin, Member]

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
