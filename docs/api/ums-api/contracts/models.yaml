openapi: 3.0.3
info:
  title: UMS Platform - Models & Training API
  description: |
    模型與訓練管理 API，提供模型、模型版本、模型架構與訓練任務的完整生命週期管理。
    
    **功能涵蓋**：
    - 模型 CRUD 操作
    - 模型版本管理
    - 模型架構目錄查詢
    - 訓練任務提交、狀態追蹤、取消
    
    **權限控制**：
    - 需要專案成員權限才能存取模型
    - Editor 角色以上可提交訓練任務
    - Owner 可刪除模型
  version: 1.0.0

servers:
  - url: https://api.ums.example.com/api/v1
    description: 正式環境

tags:
  - name: Models
    description: 模型管理
  - name: Model Versions
    description: 模型版本管理
  - name: Model Architectures
    description: 模型架構目錄
  - name: Training Jobs
    description: 訓練任務管理

paths:
  /projects/{projectId}/models:
    get:
      tags: [Models]
      summary: 查詢專案的模型清單
      operationId: getModels
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: architectureId
          in: query
          schema:
            type: integer
          description: 過濾特定架構的模型
        - name: search
          in: query
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
            default: CreatedAt
            enum: [CreatedAt, UpdatedAt, ModelName]
        - name: sortOrder
          in: query
          schema:
            type: string
            default: desc
            enum: [asc, desc]
      responses:
        '200':
          description: 成功取得模型清單
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/ModelListItemDto'
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      totalCount:
                        type: integer
                      totalPages:
                        type: integer
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    post:
      tags: [Models]
      summary: 建立新模型
      operationId: createModel
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateModelRequest'
      responses:
        '201':
          description: 模型建立成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ModelDetailDto'
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /models/{modelId}:
    get:
      tags: [Models]
      summary: 查詢模型詳細資訊
      operationId: getModelById
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 成功取得模型詳細資訊
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ModelDetailDto'
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    put:
      tags: [Models]
      summary: 更新模型
      operationId: updateModel
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateModelRequest'
      responses:
        '200':
          description: 模型更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ModelDetailDto'
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    delete:
      tags: [Models]
      summary: 刪除模型（軟刪除）
      operationId: deleteModel
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: 模型刪除成功
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: 模型正在使用中，無法刪除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /models/{modelId}/versions:
    get:
      tags: [Model Versions]
      summary: 查詢模型版本清單
      operationId: getModelVersions
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 成功取得版本清單
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModelVersionDto'
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /model-architectures:
    get:
      tags: [Model Architectures]
      summary: 查詢可用的模型架構目錄
      operationId: getModelArchitectures
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: taskType
          in: query
          schema:
            type: string
            enum: [ImageClassification, ObjectDetection, Segmentation, NLP]
          description: 過濾任務類型
        - name: framework
          in: query
          schema:
            type: string
            enum: [PyTorch, TensorFlow, ONNX]
          description: 過濾框架類型
      responses:
        '200':
          description: 成功取得架構清單
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModelArchitectureDto'
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /models/{modelId}/training-jobs:
    get:
      tags: [Training Jobs]
      summary: 查詢模型的訓練歷史
      operationId: getTrainingHistory
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 成功取得訓練歷史
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/TrainingJobDto'
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      totalCount:
                        type: integer
                      totalPages:
                        type: integer
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    post:
      tags: [Training Jobs]
      summary: 提交訓練任務
      description: |
        提交新的訓練任務到訓練佇列。系統會根據 GPU 資源可用性和優先級自動調度任務執行。
        
        **任務狀態流程**：
        Pending → Queued → Running → Completed/Failed/Cancelled
      operationId: submitTrainingJob
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitTrainingJobRequest'
      responses:
        '202':
          description: 訓練任務已接受，進入排隊
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/TrainingJobDto'
                  message:
                    type: string
                    example: 訓練任務已提交，目前排隊位置：第 5 名
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: GPU 配額不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: QUOTA_EXCEEDED
                  message: 專案 GPU 配額不足，當前已使用 80/100 小時
        '500':
          $ref: '#/components/responses/InternalServerError'

  /training-jobs/{jobId}:
    get:
      tags: [Training Jobs]
      summary: 查詢訓練任務狀態與詳細資訊
      operationId: getTrainingJobById
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 成功取得訓練任務詳細資訊
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TrainingJobDetailDto'
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /training-jobs/{jobId}/cancel:
    post:
      tags: [Training Jobs]
      summary: 取消訓練任務
      description: |
        取消正在排隊或執行中的訓練任務。
        
        **可取消狀態**：Pending、Queued、Running
        **無法取消**：Completed、Failed、Cancelled
      operationId: cancelTrainingJob
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 訓練任務取消成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TrainingJobDto'
                  message:
                    type: string
                    example: 訓練任務已取消
        '400':
          description: 任務狀態不允許取消
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: INVALID_STATE
                  message: 訓練任務已完成，無法取消
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /training-jobs/queue:
    get:
      tags: [Training Jobs]
      summary: 查詢訓練任務佇列狀態
      description: |
        查詢目前排隊中的訓練任務，按優先級和提交時間排序。
        僅顯示 Queued 狀態的任務。
      operationId: getTrainingQueue
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: 成功取得佇列狀態
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrainingJobQueueItemDto'
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key

  schemas:
    ModelListItemDto:
      type: object
      properties:
        modelId:
          type: integer
          example: 20
        modelName:
          type: string
          example: Cat Classifier v2
        description:
          type: string
        projectId:
          type: integer
        projectName:
          type: string
        architectureId:
          type: integer
        architectureName:
          type: string
          example: ResNet-50
        currentVersionNumber:
          type: integer
          example: 5
        bestAccuracy:
          type: number
          format: float
          example: 0.96
        createdBy:
          type: integer
        creatorName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ModelDetailDto:
      type: object
      properties:
        modelId:
          type: integer
        modelName:
          type: string
        description:
          type: string
        projectId:
          type: integer
        projectName:
          type: string
        architectureId:
          type: integer
        architectureName:
          type: string
        createdBy:
          type: integer
        creatorName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [Active, Archived]
        currentVersion:
          $ref: '#/components/schemas/ModelVersionDto'
        versionCount:
          type: integer
        trainingCount:
          type: integer
        bestAccuracy:
          type: number
          format: float
        deploymentCount:
          type: integer

    CreateModelRequest:
      type: object
      required:
        - modelName
        - architectureId
      properties:
        modelName:
          type: string
          maxLength: 100
          example: Cat Classifier v2
        description:
          type: string
          maxLength: 500
        architectureId:
          type: integer
          example: 3

    UpdateModelRequest:
      type: object
      required:
        - modelName
      properties:
        modelName:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500

    ModelVersionDto:
      type: object
      properties:
        versionId:
          type: integer
        modelId:
          type: integer
        versionNumber:
          type: integer
        trainingJobId:
          type: integer
        accuracy:
          type: number
          format: float
        modelFilePath:
          type: string
        createdBy:
          type: integer
        creatorName:
          type: string
        createdAt:
          type: string
          format: date-time

    ModelArchitectureDto:
      type: object
      properties:
        architectureId:
          type: integer
          example: 3
        architectureName:
          type: string
          example: ResNet-50
        description:
          type: string
          example: 50 層深度殘差網路，適用於影像分類任務
        taskType:
          type: string
          enum: [ImageClassification, ObjectDetection, Segmentation]
          example: ImageClassification
        framework:
          type: string
          enum: [PyTorch, TensorFlow, ONNX]
          example: PyTorch
        defaultHyperparameters:
          type: object
          example:
            epochs: 100
            batchSize: 32
            learningRate: 0.001
            optimizer: Adam

    TrainingJobDto:
      type: object
      properties:
        jobId:
          type: integer
          example: 501
        modelId:
          type: integer
        modelName:
          type: string
        datasetVersionId:
          type: integer
        datasetName:
          type: string
        architectureId:
          type: integer
        architectureName:
          type: string
        submittedBy:
          type: integer
        submitterName:
          type: string
        submittedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [Pending, Queued, Running, Completed, Failed, Cancelled]
          example: Queued
        priority:
          type: integer
          example: 5
        queuePosition:
          type: integer
          example: 3

    TrainingJobDetailDto:
      allOf:
        - $ref: '#/components/schemas/TrainingJobDto'
        - type: object
          properties:
            hyperparameters:
              type: object
              example:
                epochs: 100
                batchSize: 32
                learningRate: 0.001
                optimizer: Adam
            gpuRequirements:
              type: object
              properties:
                gpuCount:
                  type: integer
                  example: 2
                gpuModel:
                  type: string
                  example: A100
            gpuNodeId:
              type: integer
            gpuNodeName:
              type: string
            statusUrl:
              type: string
              example: /api/v1/training-jobs/501/status
            logsUrl:
              type: string
              example: /api/v1/training-jobs/501/logs
            metrics:
              type: object
              properties:
                currentEpoch:
                  type: integer
                totalEpochs:
                  type: integer
                trainLoss:
                  type: number
                  format: float
                trainAccuracy:
                  type: number
                  format: float
                valLoss:
                  type: number
                  format: float
                valAccuracy:
                  type: number
                  format: float

    SubmitTrainingJobRequest:
      type: object
      required:
        - datasetVersionId
        - architectureId
        - hyperparameters
        - gpuRequirements
      properties:
        datasetVersionId:
          type: integer
          example: 10
        architectureId:
          type: integer
          example: 3
        hyperparameters:
          type: object
          required:
            - epochs
            - batchSize
            - learningRate
          properties:
            epochs:
              type: integer
              minimum: 1
              example: 100
            batchSize:
              type: integer
              minimum: 1
              example: 32
            learningRate:
              type: number
              format: float
              minimum: 0.0001
              example: 0.001
            optimizer:
              type: string
              enum: [Adam, SGD, RMSprop]
              example: Adam
        priority:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
        gpuRequirements:
          type: object
          required:
            - gpuCount
          properties:
            gpuCount:
              type: integer
              minimum: 1
              maximum: 8
              example: 2
            gpuModel:
              type: string
              example: A100

    TrainingJobQueueItemDto:
      type: object
      properties:
        jobId:
          type: integer
        modelName:
          type: string
        submitterName:
          type: string
        submittedAt:
          type: string
          format: date-time
        priority:
          type: integer
        queuePosition:
          type: integer
        estimatedStartTime:
          type: string
          format: date-time
        gpuRequirements:
          type: object
          properties:
            gpuCount:
              type: integer
            gpuModel:
              type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            validationErrors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string

  responses:
    BadRequestError:
      description: 請求參數錯誤或驗證失敗
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    
    UnauthorizedError:
      description: 未提供有效的認證資訊
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    
    ForbiddenError:
      description: 權限不足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    
    NotFoundError:
      description: 資源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    
    ConflictError:
      description: 資源衝突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    
    InternalServerError:
      description: 伺服器內部錯誤
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
